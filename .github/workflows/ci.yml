name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1

jobs:
  plan:
    # CI on main is redundant in the security repository.
    if: ${{ github.repository != 'astral-sh/uv-security' || github.ref != 'refs/heads/main' }}
    uses: $/.github/workflows/plan.yml

  check-fmt:
    needs: plan
    uses: $/.github/workflows/check-fmt.yml

  check-lint:
    needs: plan
    uses: $/.github/workflows/check-lint.yml
    with:
      code-changed: ${{ needs.plan.outputs.test-code }}
      save-rust-cache: ${{ needs.plan.outputs.save-rust-cache }}

  check-docs:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' }}
    uses: $/.github/workflows/check-docs.yml
    secrets: inherit

  check-zizmor:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' }}
    uses: $/.github/workflows/check-zizmor.yml
    permissions:
      contents: read
      security-events: write

  check-publish:
    needs: plan
    if: ${{ needs.plan.outputs.test-code == 'true' }}
    uses: $/.github/workflows/check-publish.yml

  check-release:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' || needs.plan.outputs.require-check-release == 'true' }}
    uses: $/.github/workflows/check-release.yml

  check-cargo-lock-changes:
    name: "Cargo lockfile changes"
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.repository_owner == 'astral-sh' &&
        github.event.pull_request.head.repo.full_name != github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: "Check Cargo lockfile changes"
        env:
          GH_REPOSITORY: ${{ github.repository }}
          UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json
        run: uv run --script scripts/check-cargo-lock-changes.py HEAD^1 HEAD

  check-lock:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' }}
    uses: $/.github/workflows/check-lock.yml

  check-generated-files:
    needs: plan
    if: ${{ needs.plan.outputs.test-code == 'true' }}
    uses: $/.github/workflows/check-generated-files.yml
    with:
      schema-changed: ${{ needs.plan.outputs.check-schema }}
      save-rust-cache: ${{ needs.plan.outputs.save-rust-cache }}

  test:
    needs: plan
    if: ${{ needs.plan.outputs.test-code == 'true' }}
    uses: $/.github/workflows/test.yml
    with:
      save-rust-cache: ${{ needs.plan.outputs.save-rust-cache }}
      test-macos: ${{ needs.plan.outputs.test-macos }}

  test-windows-trampolines:
    needs: plan
    if: ${{ needs.plan.outputs.test-windows-trampoline == 'true' }}
    uses: $/.github/workflows/test-windows-trampolines.yml
    with:
      trampoline-build: ${{ needs.plan.outputs.test-windows-trampoline-check-binary }}

  build-dev-binaries:
    needs: plan
    if: ${{ needs.plan.outputs.test-code == 'true' }}
    uses: $/.github/workflows/build-dev-binaries.yml
    with:
      save-rust-cache: ${{ needs.plan.outputs.save-rust-cache }}

  test-smoke:
    needs:
      - plan
      - build-dev-binaries
    if: ${{ needs.plan.outputs.test-smoke == 'true' }}
    uses: $/.github/workflows/test-smoke.yml
    with:
      sha: ${{ github.sha }}

  test-integration:
    needs:
      - plan
      - build-dev-binaries
    if: ${{ needs.plan.outputs.test-integration == 'true' }}
    uses: $/.github/workflows/test-integration.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      sha: ${{ github.sha }}

  test-system:
    needs:
      - plan
      - build-dev-binaries
    if: ${{ needs.plan.outputs.test-system == 'true' }}
    uses: $/.github/workflows/test-system.yml
    with:
      sha: ${{ github.sha }}

  test-ecosystem:
    needs:
      - plan
      - build-dev-binaries
    if: ${{ needs.plan.outputs.test-ecosystem == 'true' }}
    uses: $/.github/workflows/test-ecosystem.yml
    with:
      sha: ${{ github.sha }}

  build-release-artifacts:
    needs: plan
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build:release') }}
    uses: $/.github/workflows/build-release-binaries.yml
    secrets: inherit

  required-checks-passed:
    name: "all required jobs passed"
    if: ${{ always() && github.ref != 'refs/heads/main' }}
    needs:
      - plan
      - check-cargo-lock-changes
      - check-fmt
      - check-lint
      - check-docs
      - check-lock
      - check-release
      - check-generated-files
      - test
      - test-integration
      - test-system
      - build-dev-binaries
      - build-release-artifacts
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: "Check required jobs passed"
        run: |
          failing=$(
            echo "$NEEDS_JSON" | jq -r --argjson conditional_jobs "$CONDITIONAL_JOBS" '
              to_entries[]
              | select($conditional_jobs[.key] != false)
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key): \(.value.result)"
            '
          )
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Jobs not listed here are always required.
          CONDITIONAL_JOBS: >-
            {
              "build-release-artifacts": ${{ contains(github.event.pull_request.labels.*.name, 'build:release') }},
              "check-release": ${{ needs.plan.outputs.require-check-release == 'true' }},
              "test-integration": ${{ contains(github.event.pull_request.labels.*.name, 'test:integration') }},
              "test-system": ${{ contains(github.event.pull_request.labels.*.name, 'test:system') }}
            }
