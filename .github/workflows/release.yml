# Originally generated by `cargo-dist`. This workflow is now maintained manually.
# https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * reads the release version from project metadata
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions: {}

# Run after merging the release version bump. The shared project version must
# be a Cargo-style SemVer version; cargo-dist uses it to identify prereleases.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build release artifacts without publishing
        required: true
        default: false
        type: boolean

env:
  # Release actions must not consume shared GitHub Actions caches.
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1
  UV_PYTHON_DOWNLOADS_JSON_URL: ${{ github.workspace }}/crates/uv-python-managed/download-metadata.json

jobs:
  plan:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      tag: ${{ steps.release-tag.outputs.tag }}
      tag-flag: ${{ !inputs.dry-run && format('--tag={0}', steps.release-tag.outputs.tag) || '' }}
      publishing: ${{ !inputs.dry-run }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: Resolve release tag
        if: ${{ !inputs.dry-run }}
        id: release-tag
        run: |
          tag="$(uv version --short --color never)"
          # A dispatch before the version bump merges must not republish the previous release.
          release_exists="$(gh api graphql \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f tag="$tag" \
            -f query="query(\$owner: String!, \$name: String!, \$tag: String!) { repository(owner: \$owner, name: \$name) { release(tagName: \$tag) { id } } }" \
            --jq '.data.repository | if . == null then error("Repository not found") else .release != null end')"
          if [[ "$release_exists" != "false" ]]; then
            echo "::error::Release $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          dist_args=(plan)
          if [[ "$PUBLISHING" == "true" ]]; then
            dist_args=(host --steps=create "--tag=$RELEASE_TAG")
          fi
          uv run --only-dev dist "${dist_args[@]}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
        env:
          PUBLISHING: ${{ !inputs.dry-run }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
      - name: "Upload dist-manifest.json"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-manifest-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan-dist-manifest.json

  build-release-artifacts:
    needs:
      - plan
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    permissions:
      "contents": "read"

  assemble-release-artifacts:
    name: Assemble unsigned fork release archives
    needs:
      - plan
      - build-release-artifacts
    runs-on: ubuntu-latest
    outputs:
      github-archives: ${{ steps.archives.outputs.artifact-id }}
    steps:
      - name: Download built archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: build-github-archives-*
          path: archives
          merge-multiple: true
      - name: Upload release archives
        id: archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-github-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: archives/*
          if-no-files-found: error
  generate-local-dist-manifest:
    needs:
      - plan
      - build-release-artifacts
      - assemble-release-artifacts
    runs-on: "ubuntu-latest"
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: Fetch release archives and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }},${{ needs.assemble-release-artifacts.outputs.github-archives }}
          path: target/distrib/
          merge-multiple: true
      - name: Generate local dist manifest
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          temp_manifest=target/local-dist-manifest.json.tmp
          tag_args=()
          if [[ -n "$TAG" ]]; then
            tag_args=("$TAG")
          fi
          uv run --only-dev dist manifest "${tag_args[@]}" --output-format=json --no-local-paths --artifacts=local > "$temp_manifest"
          python3 scripts/patch-dist-manifest-checksums.py --manifest "$temp_manifest" --artifacts-dir target/distrib
          mv "$temp_manifest" target/distrib/local-dist-manifest.json
      - name: Upload synthesized local dist manifest
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-manifest-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/distrib/local-dist-manifest.json

  # Build and package all the platform-agnostic(ish) things
  build-global-dist-artifacts:
    needs:
      - plan
      - build-release-artifacts
      - generate-local-dist-manifest
      - assemble-release-artifacts
    runs-on: "ubuntu-latest"
    outputs:
      artifacts: ${{ steps.artifacts.outputs.artifact-id }}
      manifest: ${{ steps.manifest.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch release archives and manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }},${{ needs.generate-local-dist-manifest.outputs.artifact }},${{ needs.assemble-release-artifacts.outputs.github-archives }}
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          uv run --only-dev dist build ${DIST_TAG_FLAG} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      - name: "Check planned GitHub release files"
        shell: bash
        run: |
          jq -r '.releases[].artifacts[]' dist-manifest.json |
            while IFS= read -r asset; do
              if [[ ! -f "target/distrib/$asset" ]]; then
                echo "Missing GitHub release asset: $asset" >&2
                exit 1
              fi
            done
      - name: "Upload artifacts"
        id: artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-github-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.cargo-dist.outputs.paths }}
      - name: "Upload global dist manifest"
        id: manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-manifest-global-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_MANIFEST_NAME }}
  # Finalize the cargo-dist manifest before publication
  finalize-dist-manifest:
    needs:
      - plan
      - build-release-artifacts
      - build-global-dist-artifacts
      - generate-local-dist-manifest
      - assemble-release-artifacts
    # Only run if we're publishing and the required builds and signing succeeded (skipped builds are fine).
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.assemble-release-artifacts.result == 'success' && needs.build-global-dist-artifacts.result == 'success' && needs.build-release-artifacts.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
      github-artifacts: ${{ needs.assemble-release-artifacts.outputs.github-archives }},${{ needs.build-global-dist-artifacts.outputs.artifacts }},${{ steps.manifest.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # Fetch artifacts from scratch-storage
      - name: Fetch release artifacts and manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }},${{ needs.generate-local-dist-manifest.outputs.artifact }},${{ needs.build-global-dist-artifacts.outputs.manifest }},${{ needs.assemble-release-artifacts.outputs.github-archives }},${{ needs.build-global-dist-artifacts.outputs.artifacts }}
          path: target/distrib/
          merge-multiple: true
      # This is a harmless no-op for GitHub Releases, hosting for that happens in "publish-github"
      - id: host
        shell: bash
        run: |
          uv run --only-dev dist host ${DIST_TAG_FLAG} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      - name: "Upload dist-manifest.json"
        id: manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-github-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-manifest.json

  publish-github:
    needs:
      - plan
      - finalize-dist-manifest
    if: ${{ needs.finalize-dist-manifest.result == 'success' }}
    runs-on: "${{ github.repository_owner == 'astral-sh' && 'ubuntu-latest' || 'ubuntu-latest' }}"
    permissions:
      "attestations": "write"
      "contents": "write"
      "id-token": "write"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          submodules: recursive
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.finalize-dist-manifest.outputs.github-artifacts }}
          path: artifacts
          merge-multiple: true
      - name: Attest
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        with:
          subject-path: |
            artifacts/*.json
            artifacts/*.sh
            artifacts/*.ps1
            artifacts/*.zip
            artifacts/*.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: "--prerelease"
          ANNOUNCEMENT_TITLE: "${{ fromJson(needs.finalize-dist-manifest.outputs.val).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(needs.finalize-dist-manifest.outputs.val).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          NEEDS_PLAN_OUTPUTS_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          scripts/dist-manifest-to-files.sh artifacts/dist-manifest.json > "$RUNNER_TEMP/release-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          gh release create --latest=false "${NEEDS_PLAN_OUTPUTS_TAG}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${assets[@]}"
